# Gradle Specifications
org.gradle.jvmargs=-Xms256M -Xmx2G
org.gradle.daemon=false

# General Specifications
mc_version=1.12.2
mod_version=1.1.1
# Sophisticated Core Legacy version compiled against (jar in deps/).
core_version=1.1.0
# DO NOT RAISE THIS. 14.23.5.2847 is the last 1.12.2 Forge build that publishes a
# `-userdev.jar` artifact. Builds 2848+ publish only `-userdev3.jar`, which is the
# ForgeGradle 3 format that the ForgeGradle 2.3 fork used here cannot consume - the
# download 404s and the build fails. This is a toolchain ceiling, not a bug.
# It does not limit what players can run: 1.12.2 Forge is binary-compatible across
# these builds, so a mod compiled against 2847 runs fine on 2860 (what RLCraft uses).
forge_version=14.23.5.2847
mod_group=com.exiledradio
mod_id=sbackpackslegacy
mod_name=Sophisticated Backpacks Legacy
mod_archives_name=SophisticatedBackpacksLegacy
mod_author=ExiledRadio
mod_description=An unofficial 1.12.2 port of Sophisticated Backpacks: tiered backpacks with upgrades for pickup, filtering, magnets, compacting, crafting, smelting, tanks and more.
mod_credits=Original mod Sophisticated Backpacks by P3pp3rF1y, ported from its GPLv3 1.16.x source. Unofficial; not affiliated with or supported by P3pp3rF1y. Licensed under the GNU GPL v3.
